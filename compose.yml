services:
  plantuml-converter:
    image: plantuml/plantuml
    container_name: plantuml-converter
    volumes:
      - .:/puml-diagrams
    environment:
      - _JAVA_OPTIONS=-Duser.home=/tmp
      - XDG_CACHE_HOME=/tmp/.cache
    working_dir: /puml-diagrams
    command: >
      sh -c "
      find -type f -name \"*.puml\" | while read file; do
        if [ -f \"$$file\" ]; then
          echo \"Processing $$file\"
          java -jar /usr/share/java/plantuml.jar -tpng \"$$file\" -o \"$${file/.puml/.png}\"
          java -jar /usr/share/java/plantuml.jar -tsvg \"$$file\" -o \"$${file/.puml/.svg}\"
        fi
      done
      "
    user: '${UID:-1000}:${GID:-1000}'
    restart: 'no'